[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "ionresolver"
version     = "0.4.0"
description = "Annotation of imaging mass spectrometry data with explicit confidence levels."
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Amar Kumar" }]

keywords = [
    "mass-spectrometry-imaging", "MALDI", "metabolomics", "annotation",
    "spatial-metabolomics", "cheminformatics", "MSI",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
imzml = ["pyimzml>=1.5"]
dev   = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/akumar901/ionresolver"
Companion = "https://github.com/akumar901/chemresolver-"

[tool.setuptools.packages.find]
where   = ["."]
include = ["ionresolver*"]
